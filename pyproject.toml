[project]
name = "directory-pipeline"
version = "0.3.0"
description = "Turn a public IIIF archive URL into a structured CSV using Gemini OCR and named entity extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 1.21 is the first release with HttpOptions.extra_body, which
    # utils.gemini.flex_http_options needs to send service_tier — and --flex is
    # on by default. Below it the resolver is free to pick 1.2.0 (surya-ocr's
    # openai<2 pin drags httpx back to 0.27, which only old google-genai
    # accepts) and every OCR/NER call fails on a pydantic extra_forbidden.
    "google-genai>=1.21",
    "numpy>=1.26",
    "pillow>=10.0",
    # Pillow 10 has no Python 3.14 build. The gpu extra's Surya caps Pillow
    # below 11, and uv's single lock otherwise settles on one Pillow (10.4) for
    # every Python, extras or not: CI on 3.14 then failed compiling it. This
    # floor makes the lock fork, so 3.14 gets a current Pillow.
    "pillow>=11; python_version >= '3.14'",
    "requests>=2.32.5",
    "python-dotenv>=1.0",
    "flask>=3.0",
    "shapely>=2.1.2",
]

[project.scripts]
pipeline = "cli.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "pipeline", "sources", "utils", "analysis"]

[dependency-groups]
# Installed by `uv sync` by default (dev group); not part of the published wheel.
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Colab notebooks re-import per cell by design — don't lint them.
extend-exclude = ["colab"]

[tool.ruff.lint]
# Bug-catching rules only (pyflakes + syntax errors). Style/formatting rules
# are deliberately not enabled — see docs/refactor-plan.md session log.
select = ["F", "E9"]

[project.optional-dependencies]
# Heavy GPU-dependent OCR models (Surya).
# Install with: uv sync --extra gpu
gpu = [
    # Capped below 0.20: the pipeline needs Surya's line detector, and 0.20
    # removed surya.foundation; 0.24 (Surya 2.5) dropped line detection for a
    # layout VLM that returns blocks. uv.lock is not tracked, so without the cap
    # a fresh sync installs the newest release and --surya-ocr fails on import.
    # Details: utils/surya_version.py, which keeps the same spec for its message.
    #
    # Not on Python 3.14: Surya 0.17 caps Pillow below 11, and Pillow 10 ships
    # no 3.14 build. uv resolves every extra into one lock, so without the
    # marker that cap reached core installs too, and CI (3.14, no extras)
    # failed compiling Pillow 10.4 from source. Run Surya on 3.13:
    #   uv sync --python 3.13 --extra gpu
    "surya-ocr>=0.17.1,<0.20; python_version < '3.14'",
    "transformers>=4.56.1,<5.0",
]
# Geocoding and map generation.
# Install with: uv sync --extra geo
geo = [
    "geopy>=2.4",
]
# Everything.
# Install with: uv sync --all-extras
all = [
    "directory-pipeline[gpu,geo]",
]
