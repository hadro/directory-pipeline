[project]
name = "directory-pipeline"
version = "0.2.0"
description = "Turn a public IIIF archive URL into a structured CSV using Gemini OCR and named entity extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "requests>=2.32.5",
    "python-dotenv>=1.0",
    "flask>=3.0",
    "shapely>=2.1.2",
]

[project.scripts]
pipeline = "cli.main:main"

[tool.uv]
package = true
# Surya (gpu extra) requires transformers <5.0; mlx-vlm 0.6.x (local-ocr extra,
# for Chandra OCR 2 / qwen3_5) requires transformers >=5.5. They cannot share a
# single resolution, so they are declared conflicting and installed into
# separate environments (e.g. `uv sync --extra gpu` vs `uv sync --extra
# local-ocr`). In practice Surya OCR runs on GPU/Colab while local OCR runs on
# Apple Silicon, so they are never needed in the same venv.
conflicts = [
    [{ extra = "gpu" }, { extra = "local-ocr" }],
    # `all` aggregates gpu (transformers <5.0), so it conflicts with local-ocr too.
    [{ extra = "all" }, { extra = "local-ocr" }],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "pipeline", "sources", "utils", "analysis"]

[dependency-groups]
# Installed by `uv sync` by default (dev group); not part of the published wheel.
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Colab notebooks re-import per cell by design — don't lint them.
extend-exclude = ["colab"]

[tool.ruff.lint]
# Bug-catching rules only (pyflakes + syntax errors). Style/formatting rules
# are deliberately not enabled — see docs/refactor-plan.md session log.
select = ["F", "E9"]

[project.optional-dependencies]
# Heavy GPU-dependent OCR models (Surya).
# Install with: uv sync --extra gpu
gpu = [
    "surya-ocr>=0.17.1",
    "transformers>=4.56.1,<5.0",
]
# Geocoding and map generation.
# Install with: uv sync --extra geo
geo = [
    "geopy>=2.4",
]
# Local (free, on-device) OCR on Apple Silicon — see pipeline/run_local_ocr.py.
# Chandra OCR 2 via mlx-vlm, and Apple Vision via ocrmac. Both are
# Apple-Silicon / macOS-only, so this is an opt-in extra (kept out of the
# default install and CI). Install with: uv sync --extra local-ocr
# mlx-vlm >=0.6.3 is required: Chandra OCR 2 is a qwen3_5-arch VLM, and that
# model module first ships in 0.6.x (0.3.x raises "Model type qwen3_5 not
# supported"). Validated against 0.6.3 in Phase 1.
local-ocr = [
    "mlx-vlm>=0.6.3",
    "ocrmac>=0.3",
]
# Everything that can co-exist in one environment. local-ocr is intentionally
# excluded: it conflicts with gpu (see [tool.uv] conflicts) and is installed
# separately with `uv sync --extra local-ocr`. Note `uv sync --all-extras` is
# unavailable while the conflict is declared — request extras explicitly.
# Install with: uv sync --extra all
all = [
    "directory-pipeline[gpu,geo]",
]
